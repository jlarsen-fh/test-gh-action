# Informational checklist items for the PR review checklist bot (.github/workflows/pr_checklist.yaml).

legend: ""

reviewer_note: "Reviewers, consider the [code review guide](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/4666851358/Code+Review+Guide) as you proceed."

areas:
  - id: general
    items:
      - id: tests-added
        text: "Tests have been added, or there is a comment with an acceptable reasoning explaining why there aren't tests"
        roles: [reviewer]
      - id: ac-current
        text: "Acceptance criteria are complete and up to date"
        roles: [author]
      - id: vi-match-ac
        text: "Verification instructions are written sufficiently for the AC"
        roles: [author, reviewer]
      - id: deployed-for-verifier
        text: "The service is deployed for the verifier"
        roles: [author]
      - id: title-format
        text: "PR title provides a good summary of the change"
        roles: [reviewer]

  - id: unified-frontend
    when:
      paths: ["microservices/cloud_run/unified_frontend/**"]
    items:
      - id: following-ufe-conventions
        text: "The change follows the [unified frontend conventions](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/5500928016/UFE+Frontend+Conventions)"
        roles: [author, reviewer]
      - id: ufe-migration-checklist
        text: "If migrating a new module, go through the [UFE Move Out Checklist](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/5471502337/Move+out+Checklist)"
        roles: [author]

  - id: area-a
    when:
      paths: ["a/**"]
    items:
      - id: really-in-a
        text: Have you thought about whether that should be in A?
        roles: [reviewer]
      - id: really-really-in-a
        text: Have you really really thought about it?
        roles: [reviewer]

  - id: area-b-txt
    when:
      paths: ["b1/*.txt", "b2/*.txt"]
    items:
      - id: txt-files-in-b
        text: "Should this actually be an .md file?"
        roles: [reviewer]
