reviewer_note: "Reviewers, consider the [code review guide](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/4666851358/Code+Review+Guide) as you proceed."

attestation:
  items:
    - id: vi-executed-author
      text: "Author: I executed the VI and manually tested this change"
    - id: vi-executed-reviewer
      text: "Reviewer: I executed the VI and manually tested this change"

areas:
  - id: general
    items:
      - id: tests-added
        text: "Tests added for the change"
        roles: [author]
      - id: title-format
        text: "PR title matches Conventional Commit + Jira ticket format"
        roles: [author]
      - id: ac-current
        text: "AC in Jira is current"
        roles: [author]
      - id: title-desc-match
        text: "PR title/description accurately reflects the diff"
        roles: [reviewer]
      - id: ac-match
        text: "AC in Jira matches what was actually built"
        roles: [reviewer]
      - id: tests-edge-cases
        text: "Tests exercise the stated edge cases, not just the happy path"
        roles: [reviewer]

  - id: unified-frontend
    when:
      paths: ["microservices/cloud_run/unified_frontend/**"]
    items:
      - id: following-ufe-conventions
        text: "The change follows the [UFE Conventions](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/5500928016/UFE+Frontend+Conventions)"
        roles: [author, reviewer]
      - id: ufe-migration-checklist
        text: "If migrating an existing module, go through the [UFE Move Out Checklist](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/5471502337/Move+out+Checklist)"
        roles: [author]

  - id: area-a
    when:
      paths: ["a/**"]
    items:
      - id: really-in-a
        text: Have you thought about whether that should be in A?
        roles: [reviewer]
      - id: really-really-in-a
        text: Have you really really thought about it?
        roles: [reviewer]

  - id: area-b-txt
    when:
      paths: ["b1/*.txt", "b2/*.txt"]
    items:
      - id: txt-files-in-b
        text: "Should this actually be an .md file?"
        roles: [reviewer]
