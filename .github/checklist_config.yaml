# Informational checklist items for the PR review checklist bot (.github/workflows/pr_checklist.yaml).
#
# This file defines the non-blocking items only. The verification attestation (the merge gate)
# is hardcoded in checklist-build-state/index.js and is not configurable here. Nothing in
# `areas` can block merge. If dynamically blockable items are needed in the future, that can
# be designed as a separate phase.
#
# No manual version field: checklist-build-state reads this file's git blob SHA from the
# Contents API at build time and stamps it into the checklist state as `config_sha`.

legend: "Check a box once done. If an item doesn't apply, edit its line to add a reason instead of checking it: `- [ ] item text — N/A: your reason`."

reviewer_note: "Reviewers, consider the [code review guide](https://auntbertha.atlassian.net/wiki/spaces/EN/pages/4666851358/Code+Review+Guide) as you proceed."

areas:
  - id: general
    items:
      - id: tests-added
        text: " Tests have been added, or there is a comment with an acceptable reasoning explaining why there aren't tests"
        roles: [author, reviewer]
      - id: ac-current
        text: "Acceptance criteria are complete and up to date"
        roles: [author, reviewer]
      - id: vi-match-ac
        text: "Verification instructions are written sufficiently for the AC"
        roles: [author, reviewer]
      - id: deployed-for-verifier
        text: "The service is deployed for the verifier"
        roles: [author]
      - id: title-format
        text: "PR title provides a good summary of the change"
        roles: [author, reviewer]
      - id: title-format-against
        text: "The PR title is what will show up in Git Blame and the commit history, so it’s important that it’s accurate."
        roles: [author]
      - id: github-checks
        text: "GitHub checks pass"
        roles: [author, reviewer]

  - id: readme-updates
    when:
      paths: ["README.md"]
    items:
      - id: say-something-nice
        text: "Make sure the README.md says something nice"
        roles: [reviewer]

  - id: area-a
    when:
      paths: ["a/**"]
    items:
      - id: really-in-a
        text: Have you thought about whether that should be in A?
        roles: [reviewer]

  - id: area-b-txt
    when:
      paths: ["b1/*.txt", "b2/*.txt"]
    items:
      - id: txt-files-in-b
        text: "Should this actually be an .md file?"
        roles: [reviewer]
