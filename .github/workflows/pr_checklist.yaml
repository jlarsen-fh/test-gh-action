name: PR Checklist

# Posts a bot-owned sticky PR comment with an informational checklist: a Verification Attestation
# section plus per-role Author/Reviewer checklists drawn from .github/checklist_config.yaml. The
# checklist is non-blocking — nothing here gates the PR.
#
# It renders on open and re-renders on each new commit so that newly-touched paths can activate
# additional conditional (area) items. Re-renders preserve boxes the author/reviewer already
# checked: GitHub persists checkbox toggles in the comment markdown between runs, and each run reads
# them back before rendering.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

concurrency:
  # Later-queued runs supersede earlier ones, and a superseded run can be cancelled without losing
  # checkbox state: checked state lives only in the sticky comment, which the checklist-build-state
  # action reads live at run time (see getChecklistBody) — never from the trigger-time payload.
  group: pr-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-render:
    name: Build checklist state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compute checklist state
        id: state
        uses: ./.github/actions/checklist-build-state

      - name: Post or update checklist comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: checklist
          number: ${{ github.event.pull_request.number }}
          message: ${{ steps.state.outputs.comment-body }}
