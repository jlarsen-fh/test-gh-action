name: PR Checklist

# Implements the PR Checklist gate. A bot-owned sticky comment lists the checklist items from
# .github/checklist_config.yaml; items marked blocking must be checked before the PR can merge. When
# every blocking item is checked, the "PR Checklist" commit status passes.
#
# Runs on PR events and on issue_comment edits (ticking a checkbox edits the bot comment), so the
# status re-evaluates as boxes are checked. Re-renders preserve ticked boxes: checked state lives in
# the comment, read live each run. Draft PRs and exempt merge-title types (revert/docs/ci/chore/test)
# pass automatically. A one-time jump-link to the comment is added to the PR description at open.
#
# The status is not yet a required check. Before adding "PR Checklist" to branch protection, run the
# backfill once (Actions > PR Checklist > Run workflow): GitHub treats a never-reported required check
# as failing, so every open PR needs at least one report first.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - edited
  workflow_dispatch:

concurrency:
  # Later-queued runs supersede earlier ones, and a superseded run can be cancelled without losing
  # checkbox state: checked state lives only in the sticky comment, which the checklist-build-state
  # action reads live at run time (see getChecklistBody), never from the trigger-time payload.
  group: pr-checklist-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-and-render:
    name: Build checklist state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    # issue_comment fires for plain issues too; only act when the thread is a PR.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    steps:
      - name: Set PR Checklist status to pending
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const headSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                })).data.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'pending',
              description: 'Evaluating the checklist…',
              context: 'PR Checklist',
            });

      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compute checklist state
        id: state
        uses: ./.github/actions/checklist-build-state

      - name: Post or update checklist comment
        if: steps.state.outputs.skip != 'true'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: checklist
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          message: ${{ steps.state.outputs.comment-body }}

      # Only on pull_request events: the jump-link is a one-time thing set at open, and
      # context.payload.pull_request is absent on issue_comment events.
      - name: Add checklist jump-link to PR description
        if: github.event_name == 'pull_request' && steps.state.outputs.skip != 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            // The interactive checklist lives in a comment (toggles there don't rerun workflows).
            // This appends a one-time jump-link to the bottom of the PR body so reviewers can find it.
            // Constants are shared with the action (dependency-free module) so they can't drift.
            const { BOT_LOGIN, COMMENT_MARKER, NUDGE_MARKER, NUDGE_MARKER_END } = require(
              `${{ github.workspace }}/.github/actions/checklist-build-state/constants.js`,
            );

            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;

            // Common case: the nudge is already present, so skip without any API calls.
            if ((pr.body || "").includes(NUDGE_MARKER)) return;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
            });
            const checklist = comments.find(
              (c) => c.user.login === BOT_LOGIN && c.body.startsWith(COMMENT_MARKER),
            );
            if (!checklist) return; // comment not posted yet; nothing to link to

            // Re-read the live body (the payload can be stale) and bail if the nudge slipped in since.
            const body =
              (await github.rest.pulls.get({ owner, repo, pull_number: pr.number })).data.body || "";
            if (body.includes(NUDGE_MARKER)) return;

            const line = `📋 [Complete the PR review checklist ↓](${checklist.html_url})`;
            const nudge = `${NUDGE_MARKER}\n${line}\n${NUDGE_MARKER_END}`;
            const newBody = body.trim() ? `${body}\n\n${nudge}` : nudge;

            await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: newBody });

      - name: Post PR Checklist status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const isDraft = '${{ steps.state.outputs.is-draft }}' === 'true';
            const skipType = '${{ steps.state.outputs.skip-type }}' === 'true';
            const gateSatisfied = '${{ steps.state.outputs.gate-satisfied }}' === 'true';

            let state, description;
            if (isDraft) {
              state = 'success';
              description = 'Draft PR, not gating yet.';
            } else if (skipType) {
              state = 'success';
              description = 'Exempt PR type, no checklist required.';
            } else if (gateSatisfied) {
              state = 'success';
              description = 'All required checklist items complete.';
            } else {
              state = 'failure';
              description = 'Required checklist items still unchecked.';
            }

            // Commit statuses are idempotent per context+SHA: the latest posted value wins, and this
            // works for both pull_request and issue_comment events regardless of the run's own commit.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.state.outputs.head-sha }}',
              state,
              description,
              context: 'PR Checklist',
            });

  # One-time sweep to report the status on every open PR before "PR Checklist" is made a required
  # check. Run manually via the Actions tab. See module.exports.backfill in the action's index.js.
  backfill:
    name: Backfill open PRs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install js-yaml
        shell: bash
        working-directory: .github/actions/checklist-build-state
        run: npm install --no-save --ignore-scripts js-yaml@4.1.0

      - name: Post PR Checklist status on all open PRs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { backfill } = require(
              `${{ github.workspace }}/.github/actions/checklist-build-state/index.js`,
            );
            await backfill({ github, context, core });
