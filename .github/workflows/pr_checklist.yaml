name: PR Checklist

# Implements the verification attestation gate: a bot-owned sticky PR comment where the author
# and reviewer each check off that they executed the VI and tested the change. When both
# attestation checkboxes are resolved, the "Verification Attestation Complete" check passes.
#
# This check is not yet a required status check. Before adding it to branch protection, run a
# one-time workflow_dispatch sweep over all currently-open PRs — GitHub treats a check that has
# never reported as failing, so every open PR needs at least one run before the flip.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  issue_comment:
    types:
      - edited

concurrency:
  # Later-queued runs supersede earlier ones. Safe because each run reads the current comment
  # body at execution time rather than the payload at trigger time, so no checkbox state is
  # lost when a queued run is cancelled.
  group: pr-checklist-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-and-render:
    name: Build checklist state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    # Skip for issue_comment events on plain issues (not PRs). The checklist-gate job below
    # always runs regardless via `if: always()`, keeping the required check from stalling.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    outputs:
      skip: ${{ steps.state.outputs.skip }}
      is-draft: ${{ steps.state.outputs.is-draft }}
      attestation-resolved: ${{ steps.state.outputs.attestation-resolved }}
    steps:
      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compute checklist state
        id: state
        uses: ./.github/actions/checklist-build-state

      - name: Post or update checklist comment
        if: steps.state.outputs.skip == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: checklist
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          message: ${{ steps.state.outputs.comment-body }}

  checklist-gate:
    name: Verification Attestation Complete
    needs: build-and-render
    permissions:
      pull-requests: read
    # Always runs so the required check always reports a conclusion. A check that only runs
    # conditionally risks GitHub treating "never reported" the same as "failed."
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for override label
        id: check-override
        uses: agilepathway/label-checker@c3d16ad512e7cea5961df85ff2486bb774caf3c5
        continue-on-error: true
        with:
          any_of: "Override: Skip Verification Attestation"
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate gate
        shell: bash
        run: |
          if [ "${{ needs.build-and-render.result }}" = "skipped" ]; then
            echo "Not a PR event - passing."
            exit 0
          fi

          if [ "${{ needs.build-and-render.result }}" != "success" ]; then
            echo "Build-state job did not succeed - failing closed."
            exit 1
          fi

          if [ "${{ needs.build-and-render.outputs.is-draft }}" = "true" ]; then
            echo "Draft PR - not gating yet."
            exit 0
          fi

          if [ "${{ steps.check-override.outcome }}" = "success" ]; then
            echo "Override label 'Override: Skip Verification Attestation' present - passing."
            exit 0
          fi

          if [ "${{ needs.build-and-render.outputs.attestation-resolved }}" = "true" ]; then
            echo "Verification attestation resolved for both author and reviewer."
            exit 0
          fi

          echo "Verification attestation still pending for author and/or reviewer."
          exit 1
