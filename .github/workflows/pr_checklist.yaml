name: PR Checklist

# Implements the verification attestation gate: a bot-owned sticky PR comment where the author
# and reviewer each check off that they executed the VI and tested the change. When both
# attestation checkboxes are resolved, the "Verification Attestation Complete" check passes.
#
# This check is not yet a required status check. Before adding it to branch protection, run a
# one-time workflow_dispatch sweep over all currently-open PRs — GitHub treats a check that has
# never reported as failing, so every open PR needs at least one run before the flip.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled
  issue_comment:
    types:
      - edited

concurrency:
  # Later-queued runs supersede earlier ones. Safe because each run reads the current comment
  # body at execution time rather than the payload at trigger time, so no checkbox state is
  # lost when a queued run is cancelled.
  group: pr-checklist-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build-and-render:
    name: Build checklist state
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    # Skip for issue_comment events on plain issues (not PRs). The commit status on the PR's
    # head SHA from the last real run persists, so no action is needed for non-PR events.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request != null
    steps:
      - name: Set attestation status to pending
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const headSha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : (await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.issue.number,
                })).data.head.sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: headSha,
              state: 'pending',
              description: 'Evaluating attestation state…',
              context: 'Verification Attestation Complete',
            });

      - name: Check out repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Compute checklist state
        id: state
        uses: ./.github/actions/checklist-build-state

      - name: Post or update checklist comment
        if: steps.state.outputs.skip == 'false'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        with:
          header: checklist
          number: ${{ github.event.pull_request.number || github.event.issue.number }}
          message: ${{ steps.state.outputs.comment-body }}

      - name: Check for override label
        id: check-override
        uses: agilepathway/label-checker@c3d16ad512e7cea5961df85ff2486bb774caf3c5
        continue-on-error: true
        with:
          any_of: "Override: Skip Verification Attestation"
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Post attestation status
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const isDraft = '${{ steps.state.outputs.is-draft }}' === 'true';
            const attestationResolved = '${{ steps.state.outputs.attestation-resolved }}' === 'true';
            const overridePresent = '${{ steps.check-override.outcome }}' === 'success';

            let state, description;
            if (isDraft) {
              state = 'success';
              description = 'Draft PR — not gating yet.';
            } else if (overridePresent) {
              state = 'success';
              description = 'Override label present.';
            } else if (attestationResolved) {
              state = 'success';
              description = 'Both attestation items resolved.';
            } else {
              state = 'failure';
              description = 'Verification attestation still pending.';
            }

            // Commit statuses are idempotent per context+SHA: the most recent posted value wins.
            // Unlike the Checks API, this works correctly for both pull_request and issue_comment
            // events regardless of which commit the workflow run itself is associated with.
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: '${{ steps.state.outputs.head-sha }}',
              state,
              description,
              context: 'Verification Attestation Complete',
            });
