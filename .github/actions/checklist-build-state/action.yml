name: "Checklist: build state"
description: >-
  Reads checklist_config.yaml from the PR base branch and reconciles it with the existing sticky
  comment (preserving ticked boxes and their inline attribution), then outputs the rendered comment
  body and the PR Checklist gate state (head-sha, is-draft, exempt, required-items-checked, skip-render).

inputs:
  github-token:
    description: "Token used for GitHub API calls."
    required: false
    default: ${{ github.token }}

outputs:
  comment-body:
    description: "Fully rendered markdown body for the sticky checklist comment. Set only when skip-render is 'false'."
    value: ${{ steps.build.outputs.comment-body }}
  skip-render:
    description: "'true' if the comment should not be re-rendered this run (bot self-edit, non-checklist comment edit, or exempt type)."
    value: ${{ steps.build.outputs.skip-render }}
  exempt:
    description: "'true' if the PR's merge-title type is exempt (revert/docs/ci/chore/test); the gate auto-passes."
    value: ${{ steps.build.outputs.exempt }}
  is-draft:
    description: "'true' while the PR is a draft; the gate passes without checking item state."
    value: ${{ steps.build.outputs.is-draft }}
  required-items-checked:
    description: "'true' when every blocking checklist item is checked."
    value: ${{ steps.build.outputs.required-items-checked }}
  head-sha:
    description: "The PR head commit SHA, so the PR Checklist status is posted against the right commit."
    value: ${{ steps.build.outputs.head-sha }}

runs:
  using: "composite"
  steps:
    # actions/github-script cannot require() a third-party package without a prior install step.
    # js-yaml is used to parse checklist_config.yaml; hand-rolling YAML parsing would risk
    # silently corrupting the checklist definition on malformed input.
    - name: Install js-yaml
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install --no-save --ignore-scripts js-yaml@4.1.0

    - name: Compute checklist state and render comment
      id: build
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const build = require(`${{ github.action_path }}/index.js`);
          await build({ github, context, core });
